name: Sync friends

on:
  issues:
    types: [labeled, unlabeled, closed, reopened, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build friends.json from approved issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          token = os.environ["GH_TOKEN"]
          url = ("https://api.github.com/repos/Mobius-msz/mobius-shell/issues"
                 "?labels=approved&state=all&per_page=100")
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "User-Agent": "friends-sync",
          })
          data = json.load(urllib.request.urlopen(req))

          def field(body, key):
              for line in (body or "").splitlines():
                  s = line.strip()
                  for sep in (":", "："):
                      if s.startswith(key + sep):
                          return s.split(sep, 1)[1].strip()
              return ""

          friends = []
          for it in data:
              if "pull_request" in it:
                  continue
              body = it.get("body") or ""
              nick = field(body, "昵称") or it["title"].replace("[好友申请]", "").strip()
              friends.append({
                  "nick": nick,
                  "school": field(body, "同学"),
                  "msg": field(body, "一句话"),
                  "date": (it.get("closed_at") or it["created_at"])[:10],
              })

          friends.sort(key=lambda f: f["date"], reverse=True)
          with open("friends.json", "w", encoding="utf-8") as f:
              json.dump(friends, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print("friends:", len(friends))
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add friends.json
          git diff --staged --quiet || git commit -m "chore: sync friends.json"
          git push
