<!DOCTYPE html><html><head><meta charset="utf-8"><title>probe</title></head><body>
<script>
fetch('https://api.github.com/repos/Mobius-msz/mobius-shell/issues?labels=approved&state=all&per_page=60', {headers:{'Accept':'application/vnd.github+json'}})
  .then(function(r){ return r.text().then(function(t){ return [r.status, t.length, r.headers.get('access-control-allow-origin')]; }); })
  .then(function(x){ document.title = 'OK|' + x.join('|'); })
  .catch(function(e){ document.title = 'ERR|' + e.name + '|' + e.message; });
</script></body></html>
