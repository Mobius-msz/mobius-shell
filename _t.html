<!DOCTYPE html><html><head><meta charset="utf-8"><title>probe2</title></head><body>
<script>
var out = [];
function step(name, p){
  return p.then(function(){ out.push(name + '=ok'); })
          .catch(function(e){ out.push(name + '=' + e.name); });
}
window.addEventListener('load', function(){
  step('nocors', fetch('https://api.github.com/zen', {mode:'no-cors'}))
  .then(function(){ return step('plain', fetch('https://api.github.com/zen')); })
  .then(function(){ return step('hdr', fetch('https://api.github.com/repos/Mobius-msz/mobius-shell/issues?labels=approved', {headers:{'Accept':'application/vnd.github+json'}})); })
  .then(function(){ document.title = out.join('|'); });
});
</script></body></html>
